<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Channel</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;

  /* pic */
  background: url('YOUR_IMAGE_LINK') no-repeat center center/cover;
}

/* Dark overlay */
.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: #111;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: red;
}

/* Hero */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  color: #ccc;
}

/* Subscribe button */
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 28px;
  background: red;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  background: darkred;
  transform: scale(1.05);
}

/* Video grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: rgba(30,30,30,0.9);
  border-radius: 10px;
  overflow: hidden;
}

.card iframe {
  width: 100%;
  height: 180px;
}

/* About */
.about {
  text-align: center;
  padding: 40px 20px;
  color: #ddd;
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  background: #111;
  color: #888;
}
</style>

</head>

<body>

<div class="overlay">

  <div class="header">
    <div class="logo">▶ My Channel</div>
  </div>

  <div class="hero">
    <h1>Welcome to My YouTube Channel</h1>
    <p>Prank • Tech • Entertainment</p>

    <a class="btn" href="https://youtube.com/@prank-boy-jubayer" target="_blank">
      ▶ Subscribe Now
    </a>
  </div>

  <div class="grid">

    <div class="card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

  </div>

  <div class="about">
    <h2>About Channel</h2>
    <p>Here you will find prank, tech and entertainment videos every week.</p>
  </div>

  <div class="footer">
    © 2026 Prank Boy Jubayer
  </div>

</div>

</body>
</html>
